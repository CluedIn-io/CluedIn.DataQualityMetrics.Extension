apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
data:
  domain: {{ .Values.cluedin.domain | quote }}
  org_name: {{ .Values.cluedin.org_name | quote }}
  verify_tls: {{ .Values.cluedin.verify_tls | quote }}
  metrics.json: |-
    {{- include "metricsConfig" . | nindent 4 }}
